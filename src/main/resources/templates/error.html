<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('')}"></nav>

<div class="page">
  <div class="panel">
    <h2>Something went wrong</h2>
    <p th:text="${error} ?: 'The request could not be processed.'">Error</p>
    <p class="muted small">
      If this keeps happening, check the application log - every action taken in
      the cockpit is recorded in the audit trail.
    </p>
    <a class="btn" href="/">Back to the dashboard</a>
  </div>
</div>
</body>
</html>
